[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trilium2obsidian"
version = "0.1.0"
description = "Migrate a Trilium Notes SQLite backup into an Obsidian vault, generically."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
trilium2obsidian = "trilium2obsidian.cli:main"

[project.urls]
Homepage = "https://github.com/Blackmesa-Canteen/trilium2obsidian"
Issues = "https://github.com/Blackmesa-Canteen/trilium2obsidian/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
