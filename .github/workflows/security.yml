name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Full-history scan via the gitleaks CLI directly, rather than the
      # gitleaks-action wrapper: that wrapper infers a base..head commit
      # range from the PR event payload, which breaks (fails closed, not a
      # real leak) on unusual histories such as a merge of unrelated
      # branches. Scanning the whole repo every run sidesteps that
      # entirely and is more thorough besides.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          curl -sSL -o checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan full repository history
        run: gitleaks detect --source . --redact -v --exit-code=1

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit declared dependencies
        run: python -m pip_audit .
